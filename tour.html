              <button type="button" role="tab" aria-selected="true" data-detail-tab="overview">Overview</button>
              <button type="button" role="tab" aria-selected="false" data-detail-tab="day-by-day">Day by Day</button>
              <button type="button" role="tab" aria-selected="false" data-detail-tab="rates">Rates</button>
              <button type="button" role="tab" aria-selected="false" data-detail-tab="inclusions">Inclusions</button>
              <button type="button" role="tab" aria-selected="false" data-detail-tab="getting-there">Getting There</button>
              <button type="button" role="tab" aria-selected="false" data-detail-tab="offered-by">Offered By</button>
            </div>
            <section class="tour-detail-panel" data-detail-panel="overview">
              <h2>Overview</h2><p>${description}</p><p>${tour.partyType || 'Private tour'} · ${tour.level} · ${tour.accommodationType || 'Lodge/Camp/Resort'} · ${tour.transport || 'Pop-up roof 4x4'} · ${mealsSummary}.</p>
              <h3>Route</h3><p>${route.join(' → ')}</p><div class="tour-map-layout">${mapMarkup}<aside class="tour-map-preview"><strong>${mapLabel}</strong><button class="btn btn-outline btn-sm" type="button" data-gallery-open>Open Photos (${photoCount})</button></aside></div>
              <section class="tour-destination-info"><h2>Main Destination: ${destinationInfo.name}</h2><div class="tour-info-cards"><div><strong>Best Time To Visit</strong><span>${destinationInfo.bestTime}</span></div><div><strong>High Season</strong><span>${destinationInfo.highSeason}</span></div><div><strong>Best Weather</strong><span>${destinationInfo.bestWeather}</span></div></div></section>
              <section class="tour-wildlife"><h2>Wildlife in ${destinationInfo.name}</h2><div class="tour-wildlife-list">${wildlifeMarkup}</div>${wildlife.length > 6 ? '<button class="btn btn-outline btn-sm" type="button" data-wildlife-toggle aria-expanded="false">Show more wildlife</button>' : ''}</section>
              ${relatedLinks}
            </section>
            <section class="tour-detail-panel" data-detail-panel="day-by-day" hidden><h2>Day by Day</h2>${dayPlanRows || '<p>Contact Pascal Travels for the day-by-day itinerary.</p>'}</section>
            <section class="tour-detail-panel" data-detail-panel="rates" hidden><h2>Rates</h2><table class="tour-rates-table"><tbody>${detailRate}${tour.soloPrice ? `<tr><th>Solo</th><td>$${Number(tour.soloPrice).toLocaleString('en-US')} USD</td></tr>` : ''}</tbody></table><p>Rates are in USD per person unless noted.</p></section>
            <section class="tour-detail-panel" data-detail-panel="inclusions" id="tour-inclusions" hidden><h2>What is included in this tour</h2><ul>${(tour.inclusions || []).map(function (item) { return `<li>${item}</li>`; }).join('')}${tour.transfer ? `<li>${tour.transfer}</li>` : ''}</ul>${featureMarkup}${activityMarkup}</section>
            <section class="tour-detail-panel" data-detail-panel="getting-there" hidden><h2>Getting There</h2><p>${route.join(' → ')}</p>${tour.transport ? `<p>${tour.transport}</p>` : ''}<div class="route-stops">${route.map(function (stop, index) { return `<button type="button" class="route-stop" data-route-stop="${index}">${stop}</button>`; }).join('')}</div></section>
            <section class="tour-detail-panel" data-detail-panel="offered-by" hidden><h2>Offered By</h2><p>Pascal Travels · ${operatorLabel} · ${reviews}</p><p>Pascal Travels can help you plan and book this package.</p></section>
            <section class="tour-interested"><h2>Interested In This Tour?</h2><a class="btn btn-gold" href="#tour-quote">Request a Quote</a><ul><li>Pascal Travels will help arrange your selected package.</li><li>Your request opens in WhatsApp with your tour details.</li></ul></section>
          </div>
          <aside class="tour-sidebar">
            <section class="card card-white tour-booking-box" id="tour-quote"><p class="eyebrow text-gold">${durationLabel} · ${tour.partyType || 'Private Tour'}</p><h2>${displayedPrice} pp (USD)</h2><p>${tour.level} · ${tour.accommodationType || 'Lodge/Camp/Resort'}</p><p><a href="#tour-inclusions" data-show-inclusions>What is included in this tour</a></p><form class="tour-quote-form" id="tour-quote-form"><label>Start Date<input name="startDate" type="date" value="${startDate}" min="${new Date().toISOString().slice(0, 10)}"></label><label>Travelers<select name="travelers">${Array.from({ length: 10 }, function (_, index) { const count = index + 1; return `<option value="${count}" ${String(count) === travelers ? 'selected' : ''}>${count} ${count === 1 ? 'traveler' : 'travelers'}</option>`; }).join('')}</select></label><button class="btn btn-gold btn-block" type="submit">Request a Quote on WhatsApp</button></form><p><strong>Plan with Pascal Travels</strong></p><p>Your tour and travel details will be prepared in WhatsApp.</p></section>
            <section class="card card-white tour-accommodation-box"><h2>Accommodation &amp; Meals</h2><p>${tour.accommodationNote || 'Additional accommodation before and at the end of the tour can be arranged for an extra cost.'}</p><div class="tour-compare-scroll"><table class="accommodation-table"><thead><tr><th>Day</th><th>Accommodation</th><th>Meals</th></tr></thead><tbody>${accommodationRows}</tbody></table></div></section>
          </aside>
        </div>${galleryMarkup}`;

      host.addEventListener('click', function (event) {
        const tabButton = event.target.closest('[data-detail-tab]');
        if (tabButton) {
          const tab = tabButton.getAttribute('data-detail-tab');
          host.querySelectorAll('[data-detail-tab]').forEach(function (item) { item.setAttribute('aria-selected', String(item === tabButton)); });
          host.querySelectorAll('[data-detail-panel]').forEach(function (panel) { panel.hidden = panel.getAttribute('data-detail-panel') !== tab; });
        }
        const routeButton = event.target.closest('[data-route-stop]');
        if (routeButton) {
          const index = Number(routeButton.getAttribute('data-route-stop'));
          host.querySelectorAll('[data-route-stop]').forEach(function (item) { item.classList.toggle('route-stop-active', item.getAttribute('data-route-stop') === String(index)); });
          const dayTab = host.querySelector('[data-detail-tab="day-by-day"]');
          dayTab.click();
          const day = host.querySelector(`#tour-day-${Math.min(index + 1, dayPlan.length)}`);
          if (day) { day.open = true; day.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        }
        if (event.target.closest('[data-gallery-open]')) host.querySelector('#tour-gallery').showModal();
        if (event.target.closest('[data-gallery-close]')) host.querySelector('#tour-gallery').close();
        if (event.target.closest('[data-wildlife-toggle]')) {
          const button = event.target.closest('[data-wildlife-toggle]');
          const expanded = button.getAttribute('aria-expanded') === 'true';
          host.querySelectorAll('[data-wildlife-extra]').forEach(function (item) { item.hidden = expanded; });
          button.setAttribute('aria-expanded', String(!expanded));
          button.textContent = expanded ? 'Show more wildlife' : 'Show less wildlife';
        }
        if (event.target.closest('[data-show-inclusions]')) {
          event.preventDefault();
          host.querySelector('[data-detail-tab="inclusions"]').click();
          host.querySelector('#tour-inclusions').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
      host.addEventListener('keydown', function (event) {
        if (event.target.matches('.route-map-stop') && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          event.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        }
      });
      host.querySelector('#tour-gallery')?.addEventListener('click', function (event) {
        if (event.target === event.currentTarget) event.currentTarget.close();
      });
      host.querySelector('#tour-quote-form').addEventListener('submit', function (event) {
        event.preventDefault();
        const formData = new FormData(event.currentTarget);
        const message = [
          `Hello Pascal Travels, please send me a quote for ${tour.destination}.`,
          `Country: ${country}`,
          `Duration: ${durationLabel}`,
          `Price per person: ${displayedPrice} USD`,
          `Operator: ${tour.operator || 'Pascal Travels'}`,
          `Route: ${route.join(' → ')}`,
          `Travelers: ${formData.get('travelers')}`,
          formData.get('startDate') ? `Start date: ${formData.get('startDate')}` : '',
          `Currency: ${currency}`
        ].filter(Boolean).join('\n');
        window.location.href = window.PascalWhatsApp.createWhatsAppUrl(message);
      });
    });
  </script>
</body>
</html>
