<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact Pascal Travels about tours, visas and overseas jobs." />
  <title>Contact | Pascal Travels</title>
  <link rel="stylesheet" href="style.css" />
  <script src="backgrounds.js" defer></script>
</head>
<body>
  <nav id="navbar" class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand"><span class="brand-text">Pascal<span class="brand-accent">Travels</span><em>&amp; Tour</em></span></a>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      <ul id="nav-links" class="nav-links">
        <li><a href="index.html">Home</a></li><li><a href="tours.html">Travel Packages</a></li><li><a href="jobs.html">Jobs Abroad</a></li><li><a href="visa.html">Visa Application</a></li><li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>
  <main class="app-root">
    <section class="section" id="services">
      <div class="container">
        <header class="section-header"><span class="eyebrow text-gold">OUR SERVICES</span><h1 class="section-title">Our Services</h1></header>
        <div id="services-grid" class="grid grid-3"></div>
      </div>
    </section>
    <section class="section section-dark">
      <div class="container">
        <header class="section-header"><h2 class="section-title">Contact Pascal Travels</h2></header>
        <ul class="contact-list">
          <li><a href="#" data-whatsapp-link data-whatsapp-message="Hello Pascal Travels, I would like to make an enquiry.">Chat with us on WhatsApp</a></li>
        </ul>
        <form id="whatsapp-contact-form" class="contact-form">
          <input name="name" placeholder="Your name" required />
          <input name="email" type="email" placeholder="Your email" required />
          <textarea name="message" rows="4" placeholder="How can we help?" required></textarea>
          <button type="submit" class="btn btn-gold">Send by WhatsApp</button>
        </form>
      </div>
    </section>
  </main>
  <footer class="section section-dark"><div class="container footer-bottom"><span><a href="#" data-whatsapp-link data-whatsapp-message="Hello Pascal Travels, I would like to make an enquiry.">WhatsApp Pascal Travels</a></span><span class="kws-association">In association with KWS <img src="images/kws-logo.jpg" alt="Kenya Wildlife Service logo" /></span><span>Developed by Remontada.co.</span></div></footer>
  <script src="data/requirements.js"></script>
  <script src="data/packages.js"></script>
  <script src="data/jobs.js"></script>
  <script src="utils.js"></script>
  <script src="whatsapp.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('whatsapp-contact-form').addEventListener('submit', function (event) {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      const message = `Contact request\nName: ${data.get('name')}\nEmail: ${data.get('email')}\nMessage: ${data.get('message')}`;
      window.location.href = window.PascalWhatsApp.createWhatsAppUrl(message);
    });
  </script>
</body>
</html>
