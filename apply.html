<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Apply for an overseas job with Pascal Travels." />
  <title>Job Application | Pascal Travels</title>
  <link rel="stylesheet" href="style.css" />
  <script src="backgrounds.js" defer></script>
</head>
<body>
  <nav id="navbar" class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand"><span class="brand-text">Pascal<span class="brand-accent">Travels</span><em>&amp; Tour</em></span></a>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      <ul id="nav-links" class="nav-links">
        <li><a href="index.html">Home</a></li><li><a href="tours.html">Travel Packages</a></li><li><a href="jobs.html">Jobs Abroad</a></li><li><a href="visa.html">Visa Application</a></li><li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>
  <main class="app-root">
    <section class="section">
      <div class="container">
        <header class="section-header"><span class="eyebrow text-gold">JOBS ABROAD</span><h1 class="section-title">Job Application</h1><p id="apply-job-details" class="section-sub"></p></header>
        <form id="job-application-form" class="card card-white form-grid-2">
          <label>Name<input name="name" required /></label>
          <label>Email<input name="email" type="email" required /></label>
          <label>Phone<input name="phone" type="tel" required /></label>
          <label>CV<input name="cv" type="file" accept=".pdf,.doc,.docx" required /></label>
          <label>Passport<input name="passport" type="file" accept=".pdf,.jpg,.jpeg,.png" required /></label>
          <label>Certificates<input name="certificates" type="file" accept=".pdf,.jpg,.jpeg,.png" required /></label>
          <label>Photo<input name="photo" type="file" accept=".jpg,.jpeg,.png" required /></label>
          <button type="submit" class="btn btn-gold">Continue by WhatsApp</button>
          <p id="job-application-notice" class="full" role="status">Selected documents are not attached automatically. Attach them in WhatsApp after it opens.</p>
        </form>
      </div>
    </section>
  </main>
  <footer class="section section-dark"><div class="container footer-bottom"><span><a href="#" data-whatsapp-link data-whatsapp-message="Hello Pascal Travels, I have a question about a job application.">WhatsApp Pascal Travels</a></span><span class="kws-association">In association with KWS <img src="images/kws-logo.jpg" alt="Kenya Wildlife Service logo" /></span><span>Developed by Remontada.co.</span></div></footer>
  <script src="data/jobs.js"></script>
  <script src="whatsapp.js"></script>
  <script>document.getElementById('nav-toggle').addEventListener('click', function () { document.getElementById('nav-links').classList.toggle('open'); });</script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const params = new URLSearchParams(window.location.search);
      const job = (window.JOBS_DATA || []).find(function (item) { return item.id === params.get('job'); });
      const details = document.getElementById('apply-job-details');
      if (!job) {
        details.textContent = 'Job not found. Return to Jobs Abroad to choose a current listing.';
        document.querySelector('#job-application-form button').disabled = true;
        return;
      }
      details.textContent = `${job.title} · ${job.country} · ${job.city} · ${job.salary}`;
      document.getElementById('job-application-form').addEventListener('submit', function (event) {
        event.preventDefault();
        const form = event.currentTarget;
        const data = new FormData(form);
        const files = ['cv', 'passport', 'certificates', 'photo'].map(function (field) {
          const file = data.get(field);
          return `${field}: ${file && file.name ? file.name : 'not selected'}`;
        }).join('\n');
        const message = `Job application: ${job.title}\nName: ${data.get('name')}\nEmail: ${data.get('email')}\nPhone: ${data.get('phone')}\n${files}\nI will attach my documents to this WhatsApp chat.`;
        window.location.href = window.PascalWhatsApp.createWhatsAppUrl(message);
        document.getElementById('job-application-notice').textContent = 'WhatsApp opened. Attach the selected documents in the chat before sending.';
      });
    });
  </script>
</body>
</html>
