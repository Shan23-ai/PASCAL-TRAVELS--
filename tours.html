<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore safari, wildlife, beach and cultural tour packages across Africa from Pascal Travels." />
  <title>Travel Packages | Pascal Travels</title>
  <link rel="stylesheet" href="style.css" />
  <script src="data/background-images.js"></script>
  <script src="backgrounds.js" defer></script>
</head>
<body>
  <nav id="navbar" class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand"><span class="brand-text">Pascal<span class="brand-accent">Travels</span><em>&amp; Tour</em></span></a>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      <ul id="nav-links" class="nav-links">
        <li><a href="index.html">Home</a></li><li><a href="tours.html">Travel Packages</a></li><li><a href="jobs.html">Jobs Abroad</a></li><li><a href="visa.html">Visa Application</a></li><li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>
  <main class="app-root">
    <section class="section section-tour">
      <div class="container">
        <header class="section-header">
          <h1 class="section-title">Travel Packages</h1>
          <p class="section-sub">Safari, wildlife, beach and cultural journeys across Africa.</p>
        </header>
        <form class="tour-search" id="tour-search" role="search" aria-label="Filter tour packages">
          <label>Country<select id="tour-country" name="country"><option value="">All countries</option></select></label>
          <label>Destination<select id="tour-destination" name="destination"><option value="">All destinations</option></select></label>
          <label>Package<select id="tour-package" name="packageId"><option value="">All packages</option></select></label>
          <label>Start Date<input id="tour-start-date" name="startDate" type="date" /></label>
          <label>Travelers
            <select id="tour-travelers" name="travelers"><option value="1">1 traveler</option><option value="2" selected>2 travelers</option><option value="3">3 travelers</option><option value="4">4 travelers</option><option value="5">5 travelers</option><option value="6">6 travelers</option></select>
          </label>
          <label>Currency
            <select id="tour-currency" name="currency"><option value="USD">USD</option><option value="KES">KES</option><option value="EUR">EUR</option><option value="GBP">GBP</option></select>
          </label>
        </form>
        <p id="tour-search-status" class="tour-search-status" role="status" aria-live="polite"></p>
        <p id="tour-currency-note" class="tour-currency-note">Package prices are shown in USD.</p>
        <div id="tours-grid" class="grid grid-3"></div>
      </div>
    </section>
  </main>
  <button class="float-whatsapp" type="button" data-whatsapp-link data-whatsapp-message="Hello Pascal Travels, I have a question about your Africa travel packages." aria-label="Chat with Pascal Travels on WhatsApp">💬</button>
  <footer class="section section-dark"><div class="container footer-bottom"><span><a href="#" data-whatsapp-link data-whatsapp-message="Hello Pascal Travels, I have a question about a travel package.">WhatsApp Pascal Travels</a></span><span class="kws-association">In association with KWS <img src="images/kws-logo.jpg" alt="Kenya Wildlife Service logo" /></span><span>Developed by Remontada.co.</span></div></footer>
  <script src="data/requirements.js"></script>
  <script src="data/packages.js"></script>
  <script src="data/regional-tours.js"></script>
  <script src="data/jobs.js"></script>
  <script src="utils.js"></script>
  <script src="whatsapp.js"></script>
  <script src="app.js"></script>
</body>
</html>
